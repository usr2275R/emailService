<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${subject}">Password reset</title>
</head>
<body style="margin:0;padding:0;background-color:#e8edf2;">
<th:block th:insert="~{fragments/finflow-email :: preheader('Reset your account password from this link')}"/>
<th:block th:insert="~{fragments/finflow-email :: pageShellStart}"/>
<th:block th:insert="~{fragments/finflow-email :: notificationTitle}"/>
<th:block th:insert="~{fragments/finflow-email :: greeting}"/>
<th:block th:insert="~{fragments/finflow-email :: messageBody}"/>
<th:block th:insert="~{fragments/finflow-email :: ctaButton}"/>
<p style="margin:0;padding:0;font-size:13px;line-height:1.55;color:#94a3b8;">If you did not request a password reset, you can ignore this email.</p>
<th:block th:insert="~{fragments/finflow-email :: pageShellEnd}"/>
</body>
</html>
