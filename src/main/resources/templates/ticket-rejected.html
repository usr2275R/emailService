<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${subject} ?: 'Ticket Rejected'">Ticket Rejected</title>
</head>
<body style="margin:0;padding:0;background-color:#edf2f7;">

<th:block th:insert="~{fragments/ticket-manager-email :: preheader(${preheader} ?: 'A ticket has been Rejected ')}"/>
<th:block th:insert="~{fragments/ticket-manager-email :: pageShellStart}"/>
<th:block th:insert="~{fragments/ticket-manager-email :: notificationTitle}"/>
<th:block th:insert="~{fragments/ticket-manager-email :: greeting}"/>

<th:block th:insert="~{fragments/ticket-manager-email :: messageBody}"/>
<th:block th:insert="~{fragments/ticket-manager-email :: ticketDetails}"/>

<th:block th:insert="~{fragments/ticket-manager-email :: reasonBlock}"/>
<th:block th:insert="~{fragments/ticket-manager-email :: ctaButton}"/>
<th:block th:insert="~{fragments/ticket-manager-email :: pageShellEnd}"/>

</body>
</html>
